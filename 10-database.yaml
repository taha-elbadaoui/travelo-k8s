apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: travelo
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: taha2005

---
apiVersion: v1
kind: Service
metadata:
  name: travelo-database
  namespace: travelo
spec:
  selector:
    app: travelo-database
  ports:
    - port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: travelo
spec:
  serviceName: travelo-database
  replicas: 1
  selector:
    matchLabels:
      app: travelo-database
  template:
    metadata:
      labels:
        app: travelo-database
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "travelo_db"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi