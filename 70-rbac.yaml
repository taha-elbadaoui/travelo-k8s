apiVersion: v1
kind: ServiceAccount
metadata:
  name: travelo-reader
  namespace: travelo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: travelo-viewer
  namespace: travelo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: travelo-viewer-binding
  namespace: travelo
subjects:
  - kind: ServiceAccount
    name: travelo-reader
    namespace: travelo
roleRef:
  kind: Role
  name: travelo-viewer
  apiGroup: rbac.authorization.k8s.io